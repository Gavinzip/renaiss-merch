<!doctype html>
<html lang="en" data-community-app>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5e3ec" />
    <meta
      name="description"
      content="Renaiss Community: member dashboard, official updates, partner activities, and Merch."
    />
    <title>Renaiss Community</title>
    <link rel="stylesheet" href="/src/components/HubReturn/HubReturnMotion.css" />
    <script>
      // Paint the same handoff color before the lazy Hub is ready; only real returns opt in.
      if (new URLSearchParams(location.search).get('hubReturn') === '1' && location.hash === '#events') {
        document.documentElement.dataset.hubReturn = 'arriving';
        addEventListener('error', () => { delete document.documentElement.dataset.hubReturn; }, { once: true });
      }
    </script>
    <style>
      html[data-community-app], html[data-community-app] body { background: #f5e3ec; color-scheme: light; }
      html[data-community-app] body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #root:empty { display: grid; place-items: center; min-height: 100svh; color: #675b68; font: 500 15px system-ui, sans-serif; }
      #root:empty::before { content: 'Renaiss'; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div id="hub-return-veil" class="hub-return-veil t-page-slide" data-page="1" aria-hidden="true"><div class="t-page" data-page-id="1"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
